<text x="30" y="440" font-size="13">Shift is in cells along all three axes. Each timestep has its own pressure and exact-velocity controls.</text>
<text x="30" y="463" font-size="13">Step 2 advects the first result with the same projected velocity; no reinitialization or second projection.</text>
<text x="30" y="486" font-size="13">Green: identical density. Yellow: nonzero L1 below 1e-6. Orange: 1e-6 to 1e-4. Red: at least 1e-4.</text>
<text x="30" y="509" font-size="12">This tests the original sampled plateau budgets; it does not establish a safe pressure stopping rule.</text>
